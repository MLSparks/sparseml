name: sparkrun

on:
  push:
    branches: [main]
    paths: ["sparkrun/**", ".github/workflows/sparkrun.yml"]
  pull_request:
    paths: ["sparkrun/**", ".github/workflows/sparkrun.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sparkrun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline demo
        run: python examples/demo.py
      - name: Package installs
        run: |
          python -m pip install --quiet .
          sparkrun --help
          python -c "import sparkrun; print('sparkrun', sparkrun.__version__)"
